name: MCS security smoke
on:
  pull_request:
    paths:
      - 'src/index.html'
      - 'avatar-3d/**'
      - 'tests/avatar-3d-safety-smoke.cjs'
      - 'tests/security-smoke.cjs'
      - '.github/workflows/mcs-security-smoke.yml'
  push:
    branches:
      - main
      - 'security/**'
      - 'fix/pbr-default-full-avatar-materials'
jobs:
  security-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run MCS security regression and inline JavaScript syntax checks
        run: node tests/security-smoke.cjs
      - name: Run 3D avatar fail-closed safety smoke
        run: node tests/avatar-3d-safety-smoke.cjs