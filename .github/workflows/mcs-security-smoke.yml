name: MCS security and product smoke
on:
  pull_request:
    paths:
      - 'src/index.html'
      - 'avatar-3d/**'
      - 'src/avatar-3d/**'
      - 'fashion-studio/**'
      - 'src/fashion-studio/**'
      - 'tests/**'
      - 'docs/3d-asset-manifest.schema.json'
      - 'supabase/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'security/**'
      - 'integration/**'
      - 'fix/**'
      - 'feature/**'
    paths:
      - 'src/index.html'
      - 'avatar-3d/**'
      - 'src/avatar-3d/**'
      - 'fashion-studio/**'
      - 'src/fashion-studio/**'
      - 'tests/**'
      - 'docs/3d-asset-manifest.schema.json'
      - 'supabase/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  regression-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Verify product changes have matching regression tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');

          const base = process.env.BASE_SHA || '';
          const range = /^[0]+$/.test(base) || !base ? 'HEAD^...HEAD' : base + '...HEAD';
          const changed = execFileSync('git', ['diff', '--name-only', range], { encoding: 'utf8' })
            .split(/\r?\n/).filter(Boolean);
          const touches = (pattern) => changed.some((file) => pattern.test(file));

          if (touches(/^(avatar-3d|src\/avatar-3d)\//)) {
            assert.ok(fs.existsSync('tests/avatar-3d-safety-smoke.cjs'),
              'Avatar 3D source changed without tests/avatar-3d-safety-smoke.cjs');
          }
          if (touches(/^(fashion-studio|src\/fashion-studio)\//)) {
            assert.ok(fs.existsSync('tests/fashion-studio-smoke.cjs'),
              'Fashion Studio source changed without tests/fashion-studio-smoke.cjs');
          }
          if (touches(/^src\/index\.html$/)) {
            assert.ok(fs.existsSync('tests/security-smoke.cjs'),
              'Main application source changed without tests/security-smoke.cjs');
          }
          console.log('PASS: changed product surfaces have their required regression suites.');
          NODE

      - name: Run MCS security regression and inline JavaScript syntax checks
        run: node tests/security-smoke.cjs

      - name: Run Avatar 3D safety and loader tests
        if: hashFiles('tests/avatar-3d-safety-smoke.cjs') != ''
        run: node tests/avatar-3d-safety-smoke.cjs

      - name: Run avatar animation and resource lifecycle tests
        if: hashFiles('tests/avatar-runtime-hardening-smoke.cjs') != ''
        run: node tests/avatar-runtime-hardening-smoke.cjs

      - name: Run avatar account bridge tests
        if: hashFiles('tests/avatar-account-bridge-smoke.cjs') != ''
        run: node tests/avatar-account-bridge-smoke.cjs

      - name: Run Fashion Studio interaction and mapping tests
        if: hashFiles('tests/fashion-studio-smoke.cjs') != ''
        run: node tests/fashion-studio-smoke.cjs
