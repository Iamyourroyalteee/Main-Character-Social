name: Avatar 3D smoke tests

on:
  pull_request:
    paths:
      - "avatar-3d/**"
      - "src/avatar-3d/**"
      - "tests/avatar-3d-safety-smoke.cjs"
      - "tests/avatar-runtime-hardening-smoke.cjs"
      - ".github/workflows/avatar-3d-smoke.yml"
  push:
    branches:
      - "fix/pbr-default-full-avatar-materials"
      - "integration/avatar-pbr-reconciled"
    paths:
      - "avatar-3d/**"
      - "src/avatar-3d/**"
      - "tests/avatar-3d-safety-smoke.cjs"
      - "tests/avatar-runtime-hardening-smoke.cjs"
      - ".github/workflows/avatar-3d-smoke.yml"

jobs:
  avatar-3d-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run avatar 3D safety and loader tests
        run: node tests/avatar-3d-safety-smoke.cjs
      - name: Run avatar animation and resource lifecycle regression tests
        run: node tests/avatar-runtime-hardening-smoke.cjs
